[workspace]
members = ["crates/kicad-parser", "crates/snx-writer", "crates/cli"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-or-later"
edition = "2024"
version = "0.2.0"
authors = ["Caner Alp <caner.alp@alpelectronix.com>"]
repository = "https://github.com/alplabai/signex-kicad-import"

[workspace.dependencies]
# Serialization
serde_json = "1"

# Identity
uuid = { version = "1.23.1", features = ["v4"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Tests: the writer's output is checked by parsing it back
toml = "0.8"

# Internal crates of this companion repo
kicad-parser = { path = "crates/kicad-parser" }
snx-writer = { path = "crates/snx-writer" }
